name: iOS TestFlight Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional numeric build suffix. Defaults to MMDDHHMM."
        required: false
      upload:
        description: "Upload the IPA to App Store Connect"
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  IOS_IPA_PATH: "src-tauri/gen/apple/build/arm64/Tachyon Cowork.ipa"

concurrency:
  group: ios-testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build and upload TestFlight IPA
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-ios-testflight
          workspaces: src-tauri -> target

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Import iOS signing certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]; then
            echo "IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not set; relying on Xcode automatic signing."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is not set; relying on Xcode automatic signing."
            exit 0
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/bin/security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Check iOS Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib

      - name: Set iOS build number
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_NUMBER="$(date +%m%d%H%M)${GITHUB_RUN_ATTEMPT}"
          else
            BUILD_NUMBER="$(date +%m%d%H%M | sed 's/^0*//')"
          fi
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using iOS build number: $BUILD_NUMBER"

      - name: Build iOS IPA
        run: mise run ios:build

      - name: Verify export compliance key in IPA
        id: ipa
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          unzip -q "$IOS_IPA_PATH" -d "$TMPDIR"
          VALUE="$(plutil -extract ITSAppUsesNonExemptEncryption raw "$TMPDIR/Payload/Tachyon Cowork.app/Info.plist")"
          VERSION="$(plutil -extract CFBundleVersion raw "$TMPDIR/Payload/Tachyon Cowork.app/Info.plist")"
          rm -rf "$TMPDIR"
          test "$VALUE" = "false"
          echo "Verified ITSAppUsesNonExemptEncryption=false in build $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachyon-Cowork-iOS-IPA
          path: ${{ env.IOS_IPA_PATH }}

      - name: Upload to App Store Connect
        if: github.event_name == 'pull_request' || inputs.upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: mise run ios:upload

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.ipa.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Uploaded TestFlight build \`${version}\` for this PR.`
            });
