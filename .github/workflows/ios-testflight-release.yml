name: iOS TestFlight Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional numeric build suffix. Defaults to MMDDHHMM."
        required: false
      upload:
        description: "Upload the IPA to App Store Connect"
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  IOS_IPA_PATH: "src-tauri/gen/apple/build/arm64/Tachyon Cowork.ipa"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ios-testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build iOS IPA and upload TestFlight on main
    runs-on: macos-26
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          PR_NUMBER=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "$COMMIT_SUBJECT" =~ \#([0-9]+) ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
          fi

          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$PR_NUMBER" ]; then
            echo "TESTFLIGHT_RELEASE_NOTES=PR #$PR_NUMBER / commit $SHORT_SHA" >> "$GITHUB_ENV"
          else
            echo "TESTFLIGHT_RELEASE_NOTES=commit $SHORT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Prepare marketing version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const configPath = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const current = String(config.version);
          let next = current;

          if (
            process.env.GITHUB_EVENT_NAME === 'push' &&
            process.env.GITHUB_REF === 'refs/heads/main'
          ) {
            const parts = current.split('.').map((part) => Number.parseInt(part, 10));
            if (parts.length !== 3 || parts.some((part) => Number.isNaN(part))) {
              throw new Error(`Unsupported marketing version: ${current}`);
            }

            parts[2] += 1;
            next = parts.join('.');
            config.version = next;
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `MARKETING_VERSION=${next}\n`);
          console.log(`Using marketing version: ${next}`);
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Rust compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-ios-testflight
          workspaces: src-tauri -> target

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Import iOS signing certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]; then
            echo "IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not set; relying on Xcode automatic signing."
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is not set; relying on Xcode automatic signing."
            exit 0
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/profile.plist"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          test -s "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST_PATH")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST_PATH")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST_PATH")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"
          echo "IOS_DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Initialize generated iOS project
        run: |
          set -euo pipefail
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi
          ./scripts/sync-ios-icons.sh

      - name: Configure manual iOS signing
        run: |
          set -euo pipefail
          test -n "${IOS_PROVISIONING_PROFILE_SPECIFIER:-}"
          test -n "${IOS_DEVELOPMENT_TEAM:-}"
          PBXPROJ="src-tauri/gen/apple/tachyon-cowork.xcodeproj/project.pbxproj"
          perl -0pi -e '
            s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{IOS_PROVISIONING_PROFILE_SPECIFIER}";/g;
            s/DEVELOPMENT_TEAM = "[^"]+";/DEVELOPMENT_TEAM = "$ENV{IOS_DEVELOPMENT_TEAM}";/g;
          ' "$PBXPROJ"

      - name: Set iOS build number
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_NUMBER="$(date +%m%d%H%M)${GITHUB_RUN_ATTEMPT}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            test -n "${PR_NUMBER:-}"
            BUILD_NUMBER="${PR_NUMBER}${GITHUB_RUN_ATTEMPT}"
          else
            BUILD_NUMBER="$(date +%m%d%H%M | sed 's/^0*//')"
          fi
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using iOS build number: $BUILD_NUMBER"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          npx tauri ios build --ci --export-method app-store-connect --build-number "$IOS_BUILD_NUMBER" --archive-only

      - name: Export iOS IPA
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          ARCHIVE_PATH="src-tauri/gen/apple/build/tachyon-cowork_iOS.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ios-export"

          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.quantumbox.tachyon-cowork</key>
              <string>${IOS_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          mkdir -p "$(dirname "$IOS_IPA_PATH")"
          cp "$EXPORT_PATH/Tachyon Cowork.ipa" "$IOS_IPA_PATH"

      - name: Verify export compliance key and icons in IPA
        id: ipa
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          unzip -q "$IOS_IPA_PATH" -d "$TMPDIR"
          VALUE="$(plutil -extract ITSAppUsesNonExemptEncryption raw "$TMPDIR/Payload/Tachyon Cowork.app/Info.plist")"
          VERSION="$(plutil -extract CFBundleVersion raw "$TMPDIR/Payload/Tachyon Cowork.app/Info.plist")"
          rm -rf "$TMPDIR"
          test "$VALUE" = "false"
          ./scripts/ci/verify-ios-icons.sh
          echo "Verified ITSAppUsesNonExemptEncryption=false in build $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tachyon-Cowork-iOS-IPA
          path: ${{ env.IOS_IPA_PATH }}

      - name: Upload to App Store Connect
        if: github.event_name == 'push' || github.event.inputs.upload == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          APP_STORE_CONNECT_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" mise run ios:upload

      - name: Set TestFlight release notes
        if: github.event_name == 'push' || github.event.inputs.upload == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_BUNDLE_ID: com.quantumbox.tachyon-cowork
          LOCALE: en-US
        run: |
          set -euo pipefail
          export APP_STORE_CONNECT_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          node <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const apiBase = 'https://api.appstoreconnect.apple.com';
          const keyId = process.env.APP_STORE_CONNECT_KEY_ID;
          const issuerId = process.env.APP_STORE_CONNECT_ISSUER_ID;
          const privateKey = fs.readFileSync(process.env.APP_STORE_CONNECT_KEY_PATH, 'utf8');
          const bundleId = process.env.APP_BUNDLE_ID;
          const marketingVersion = process.env.MARKETING_VERSION;
          const buildNumber = process.env.IOS_BUILD_NUMBER;
          const locale = process.env.LOCALE;
          const whatsNew = process.env.TESTFLIGHT_RELEASE_NOTES;

          function base64url(value) {
            return Buffer.from(value).toString('base64url');
          }

          function createToken() {
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'ES256', kid: keyId, typ: 'JWT' };
            const payload = {
              aud: 'appstoreconnect-v1',
              exp: now + 20 * 60,
              iat: now,
              iss: issuerId,
            };
            const body = `${base64url(JSON.stringify(header))}.${base64url(
              JSON.stringify(payload),
            )}`;
            const signature = crypto.sign('sha256', Buffer.from(body), {
              key: privateKey,
              dsaEncoding: 'ieee-p1363',
            });
            return `${body}.${signature.toString('base64url')}`;
          }

          async function request(path, options = {}) {
            const response = await fetch(`${apiBase}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${createToken()}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) {
              throw new Error(
                `App Store Connect API ${response.status} ${response.statusText}: ${text}`,
              );
            }
            return data;
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function findBuild(appId) {
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const preReleaseVersions = await request(
                `/v1/preReleaseVersions?filter[app]=${appId}&filter[platform]=IOS&filter[version]=${encodeURIComponent(
                  marketingVersion,
                )}&limit=1`,
              );
              const preReleaseVersion = preReleaseVersions.data?.[0];
              if (preReleaseVersion) {
                const builds = await request(
                  `/v1/builds?filter[preReleaseVersion]=${preReleaseVersion.id}&filter[version]=${encodeURIComponent(
                    buildNumber,
                  )}&limit=1`,
                );
                const build = builds.data?.[0];
                if (build) {
                  return build;
                }
              }

              console.log(
                `Waiting for TestFlight build ${marketingVersion} (${buildNumber}) to appear (${attempt}/30)...`,
              );
              await sleep(30_000);
            }
            throw new Error(
              `Could not find TestFlight build ${marketingVersion} (${buildNumber})`,
            );
          }

          const apps = await request(
            `/v1/apps?filter[bundleId]=${encodeURIComponent(bundleId)}&limit=1`,
          );
          const app = apps.data?.[0];
          if (!app) {
            throw new Error(`Could not find app for bundle id ${bundleId}`);
          }

          const build = await findBuild(app.id);
          const localizations = await request(
            `/v1/builds/${build.id}/betaBuildLocalizations?filter[locale]=${encodeURIComponent(
              locale,
            )}&limit=1`,
          );
          const localization = localizations.data?.[0];

          if (localization) {
            await request(`/v1/betaBuildLocalizations/${localization.id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                data: {
                  id: localization.id,
                  type: 'betaBuildLocalizations',
                  attributes: { whatsNew },
                },
              }),
            });
          } else {
            await request('/v1/betaBuildLocalizations', {
              method: 'POST',
              body: JSON.stringify({
                data: {
                  type: 'betaBuildLocalizations',
                  attributes: { locale, whatsNew },
                  relationships: {
                    build: {
                      data: { id: build.id, type: 'builds' },
                    },
                  },
                },
              }),
            });
          }

          console.log(`Set TestFlight release notes: ${whatsNew}`);
          NODE

      - name: Commit bumped marketing version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/tauri.conf.json; then
            echo "No marketing version change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "[skip ci] chore: bump version to ${MARKETING_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Show Rust compiler cache stats
        if: always()
        run: sccache --show-stats

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.ipa.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Built iOS IPA \`${version}\` for this PR. TestFlight upload runs on main push.`
            });

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PLATFORM_ALERTS_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "PLATFORM_ALERTS_SLACK_WEBHOOK is not configured; skipping Slack alert."
            exit 0
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/slack-payload.json"
          import json
          import os

          payload = {
              "text": (
                  ":x: iOS TestFlight Release failed\n"
                  f"Repository: {os.environ['GITHUB_REPOSITORY']}\n"
                  f"Ref: {os.environ['GITHUB_REF_NAME']}\n"
                  f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )
          }
          print(json.dumps(payload))
          PY

          curl -fsS \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/slack-payload.json" \
            "$SLACK_WEBHOOK_URL"
