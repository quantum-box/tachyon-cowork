[package]
name = "tachyon-cowork"
version = "0.2.1"
description = "Tachyon Cowork - AI Assistant Desktop App"
edition = "2021"

[lib]
name = "tachyon_cowork_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tachyon-sdk = { git = "https://github.com/quantum-box/tachyon-sdk.git", subdirectory = "rust", rev = "d360f67", default-features = false, features = ["rustls"] }
calamine = "0.26"
rust_xlsxwriter = "0.80"
base64 = "0.22"
zip = "2"
quick-xml = "0.37"
walkdir = "2"
blake3 = "1"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
lopdf = "0.34"
tauri-plugin-deep-link = "2.0.0"
rmcp = { version = "1.3", features = ["client", "transport-child-process"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
cpal = "0.15"
hound = "3.5"
tauri-plugin-oauth-session = "0.1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
microsandbox = "0.3"
trash = "5"
tauri-plugin-webdriver-automation = "0.1.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
