[advisories]
ignore = [
    # glib 0.18 unsound VariantStrIter - transitive via tauri -> gtk/webkit2gtk (Linux only)
    "RUSTSEC-2024-0429",
    # unic-ucd-version unmaintained - transitive via tauri -> urlpattern -> unic-ucd-ident
    "RUSTSEC-2025-0098",
    # rsa timing sidechannel - transitive via microsandbox -> sqlx-mysql (no fix available)
    "RUSTSEC-2023-0071",
    # rustls-webpki CRL matching - transitive via tauri/microsandbox -> reqwest -> rustls
    "RUSTSEC-2026-0049",
    # hickory-proto O(n^2) DNS name compression - transitive via microsandbox-network 0.3.x, fixed in hickory 0.26 but not compatible with microsandbox 0.3
    "RUSTSEC-2026-0119",
    # hickory-proto NSEC3 validation loop - transitive via microsandbox-network 0.3.x, no fixed upgrade available in the current dependency line
    "RUSTSEC-2026-0118",
]

[yanked]
enabled = false  # uds_windows 1.2.0 yanked - transitive via microsandbox -> keyring -> zbus
